[package]
name = "thecurse_game"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = ["dev"]
dev = [
  "thecurse_core/dev",
  "bevy/bevy_ui_debug",
  "dep:bevy-inspector-egui",
  "vleue_navigator/debug-with-gizmos",
]

[dependencies]
thecurse_core = { workspace = true, features = ["game"] }

bevy.workspace = true
bevy-inspector-egui = { workspace = true, optional = true }
bevy_console.workspace = true
bevy_skein.workspace = true

avian3d = { workspace = true, features = [
  "collider-from-mesh",
  "bevy_scene",
  "bevy_picking",
  "debug-plugin",
] }
vleue_navigator = { workspace = true, optional = true }

thiserror.workspace = true
rand.workspace = true
clap.workspace = true

serde.workspace = true
ron.workspace = true
smol.workspace = true
futures.workspace = true

[lints]
workspace = true

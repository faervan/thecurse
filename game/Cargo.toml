[package]
name = "dreamgame_game"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = ["dev"]
dev = [
  "dreamgame_core/dev",
  "bevy/bevy_ui_debug",
  "dep:bevy-inspector-egui",
  "vleue_navigator/debug-with-gizmos",
]

[dependencies]
dreamgame_core.workspace = true
dreamgame_server.workspace = true

bevy.workspace = true
avian3d = { workspace = true, features = [
  "collider-from-mesh",
  "bevy_scene",
  "bevy_picking",
  "debug-plugin",
] }
bevy_enhanced_input.workspace = true
bevy_skein.workspace = true
vleue_navigator = { workspace = true, optional = true }
bevy_hanabi.workspace = true
bevy_easings.workspace = true
bevy-inspector-egui = { workspace = true, optional = true }

smol.workspace = true
futures.workspace = true

[lints]
workspace = true
